# Headless LearnHarness on the LAN.
#
#   export LH_PASSWORD='a long password'
#   docker compose up -d --build
#
# Data (chats, graph, settings, API keys) persists in the lh-data volume.
# Set LH_COOKIE_SECURE=1 when a reverse proxy terminates HTTPS.

services:
  learnharness:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      LH_DATA_DIR: /data
      LH_AUTH_FILE: /data/auth.json
      LH_HEADLESS: "1"
      LH_PASSWORD: ${LH_PASSWORD:?Set LH_PASSWORD}
      LH_SESSION_SECRET: ${LH_SESSION_SECRET:-}
      LH_COOKIE_SECURE: ${LH_COOKIE_SECURE:-}
      LH_SESSION_DAYS: ${LH_SESSION_DAYS:-}
    volumes:
      - lh-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lh-data:
